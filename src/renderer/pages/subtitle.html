<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <title>VoiceInk 字幕</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0d1012;
      }

      body {
        padding: 4px;
        font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -webkit-user-select: none;
        user-select: none;
      }

      .subtitle-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        border: 1px solid var(--subtitle-border-strong);
        border-radius: var(--subtitle-radius);
        background: var(--subtitle-bg);
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.34);
      }

      .drag-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid var(--subtitle-border);
        background: var(--subtitle-surface);
        -webkit-app-region: drag;
      }

      .drag-indicator {
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: var(--subtitle-border-strong);
      }

      .controls {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }

      .control-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 32px;
        padding: 0 7px;
        border: 1px solid var(--subtitle-border);
        border-radius: var(--control-radius);
        background: var(--subtitle-surface);
        color: var(--subtitle-text);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        opacity: 0.78;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          color 140ms ease,
          opacity 140ms ease,
          transform 120ms var(--ease-out);
      }

      @media (hover: hover) and (pointer: fine) {
        .control-btn:hover {
          border-color: var(--subtitle-border-strong);
          background: var(--subtitle-surface-strong);
          opacity: 1;
        }

        .control-btn:active:hover {
          transform: scale(0.97);
        }

        .control-btn.close-btn:hover {
          border-color: color-mix(in srgb, var(--subtitle-danger) 54%, transparent);
          background: color-mix(in srgb, var(--subtitle-danger) 28%, transparent);
        }
      }

      .control-btn:focus-visible {
        outline: 2px solid var(--subtitle-accent);
        outline-offset: 2px;
        opacity: 1;
      }

      .control-btn.copied {
        border-color: color-mix(in srgb, var(--subtitle-success) 54%, transparent);
        background: color-mix(in srgb, var(--subtitle-success) 32%, transparent);
      }

      .subtitle-history {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
      }

      .subtitle-history::-webkit-scrollbar {
        width: 6px;
      }

      .subtitle-history::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .subtitle-history::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
      }

      .subtitle-history::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      :root {
        --subtitle-scale: 1;
        --subtitle-bg: rgba(20, 25, 27, 0.97);
        --subtitle-surface: rgba(244, 241, 232, 0.07);
        --subtitle-surface-strong: rgba(244, 241, 232, 0.11);
        --subtitle-border: rgba(244, 241, 232, 0.14);
        --subtitle-border-strong: rgba(244, 241, 232, 0.22);
        --subtitle-text: #f4f1e8;
        --subtitle-muted: #a6adab;
        --subtitle-accent: #7da6b7;
        --subtitle-success: #59c889;
        --subtitle-danger: #e86960;
        --subtitle-radius: 12px;
        --control-radius: 10px;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }

      .subtitle-line {
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: var(--control-radius);
        background: transparent;
        color: color-mix(in srgb, var(--subtitle-text) 52%, transparent);
        font-size: calc(18px * var(--subtitle-scale));
        font-weight: 400;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.72);
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      .subtitle-line:last-child {
        border-color: var(--subtitle-border);
        background: var(--subtitle-surface);
        color: var(--subtitle-text);
        font-size: calc(22px * var(--subtitle-scale));
        font-weight: 550;
      }

      .subtitle-line:last-child .subtitle-source {
        color: var(--subtitle-muted);
        font-size: calc(16px * var(--subtitle-scale));
        font-weight: 400;
      }

      .subtitle-line:last-child .subtitle-translation {
        color: var(--subtitle-text);
        font-size: calc(22px * var(--subtitle-scale));
        font-weight: 550;
      }

      .subtitle-source {
        display: block;
        margin-bottom: 3px;
        color: color-mix(in srgb, var(--subtitle-muted) 72%, transparent);
        font-size: calc(14px * var(--subtitle-scale));
        font-weight: 400;
        line-height: 1.35;
      }

      .subtitle-translation {
        display: block;
        color: inherit;
        font-size: inherit;
        font-weight: inherit;
        line-height: 1.4;
      }

      .subtitle-line.provisional .subtitle-source {
        font-style: italic;
      }

      .subtitle-empty {
        color: rgba(255, 255, 255, 0.5);
        font-size: calc(18px * var(--subtitle-scale));
        text-align: center;
        font-style: italic;
      }

      .toast {
        position: fixed;
        bottom: 14px;
        left: 50%;
        padding: 7px 13px;
        border: 1px solid color-mix(in srgb, var(--subtitle-success) 42%, transparent);
        border-radius: var(--control-radius);
        background: color-mix(in srgb, var(--subtitle-success) 28%, var(--subtitle-bg));
        color: var(--subtitle-text);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
        font-size: 12px;
        opacity: 0;
        transform: translateX(-50%);
        transition: opacity 160ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="subtitle-container">
      <div class="drag-area">
        <div class="drag-indicator"></div>
        <div class="controls">
          <button id="fontDownBtn" class="control-btn" title="縮小字級" aria-label="縮小字級">A−</button>
          <button id="fontUpBtn" class="control-btn" title="放大字級" aria-label="放大字級">A+</button>
          <button id="opacityBtn" class="control-btn" title="調整視窗透明度" aria-label="調整視窗透明度">◐</button>
          <button id="displayModeBtn" class="control-btn" title="字幕顯示模式" aria-label="字幕顯示模式">雙</button>
          <button id="copyBtn" class="control-btn" title="複製全部字幕" aria-label="複製全部字幕">
            📋
          </button>
          <button
            id="closeBtn"
            class="control-btn close-btn"
            title="關閉字幕視窗"
            aria-label="關閉字幕視窗"
          >
            ✕
          </button>
        </div>
      </div>

      <div id="subtitleHistory" class="subtitle-history">
        <p class="subtitle-empty">等待字幕...</p>
      </div>
    </div>

    <div id="toast" class="toast">已複製到剪貼簿</div>

    <script>
      const subtitleHistory = document.getElementById("subtitleHistory");
      const copyBtn = document.getElementById("copyBtn");
      const toast = document.getElementById("toast");

      /** @type {{ id: string, source: string, translation: string }[]} */
      const subtitles = [];
      const MAX_HISTORY = 50;
      let autoId = 0;

      // 字幕彈窗獨佔顯示模式：bilingual 雙語｜translation 僅翻譯（持久化於 store）
      let currentMode = "bilingual";

      /**
       * 正規化 payload：字串 → append 純文字；物件 → upsert/append
       * @param {string | object} payload
       */
      function normalizePayload(payload) {
        if (typeof payload === "string") {
          const text = payload.trim();
          if (!text) return null;
          return {
            id: `s-${++autoId}`,
            source: text,
            translation: "",
            action: "append",
          };
        }
        if (!payload || typeof payload !== "object") return null;

        const source = String(payload.source || payload.text || "").trim();
        const translation = String(payload.translation || "").trim();
        if (!source && !translation) return null;

        return {
          id: payload.id ? String(payload.id) : `s-${++autoId}`,
          source,
          translation,
          action: payload.action === "upsert" ? "upsert" : "append",
        };
      }

      function isAtBottom() {
        return (
          subtitleHistory.scrollHeight -
            subtitleHistory.clientHeight -
            subtitleHistory.scrollTop <=
          24
        );
      }

      function createSubtitleLine(entry) {
        const hasTranslation = !!entry.translation;
        const line = document.createElement("div");
        line.className = hasTranslation
          ? "subtitle-line"
          : "subtitle-line provisional";
        line.dataset.id = entry.id;

        if (currentMode === "translation") {
          const translation = document.createElement("span");
          translation.className = "subtitle-translation";
          translation.textContent = hasTranslation
            ? entry.translation
            : entry.source;
          line.appendChild(translation);
          return line;
        }

        const source = document.createElement("span");
        source.className = "subtitle-source";
        source.textContent = entry.source;
        line.appendChild(source);
        if (hasTranslation) {
          const translation = document.createElement("span");
          translation.className = "subtitle-translation";
          translation.textContent = entry.translation;
          line.appendChild(translation);
        }
        return line;
      }

      function createEmptyState() {
        const empty = document.createElement("p");
        empty.className = "subtitle-empty";
        empty.textContent = "等待字幕...";
        return empty;
      }

      /** 顯示模式切換才整批重建；一般字幕更新只動一行。 */
      function renderSubtitles() {
        const stickToBottom = isAtBottom();
        const nodes = subtitles.length
          ? subtitles.map(createSubtitleLine)
          : [createEmptyState()];
        subtitleHistory.replaceChildren(...nodes);
        if (stickToBottom) subtitleHistory.scrollTop = subtitleHistory.scrollHeight;
      }

      /**
       * 增量更新單行，避免每次 ASR／翻譯回來都重建 50 行 DOM。
       * @param {string} id
       * @param {string | null} removedId
       */
      function renderSubtitleUpdate(id, removedId) {
        const stickToBottom = isAtBottom();
        const empty = subtitleHistory.querySelector(".subtitle-empty");
        if (empty) empty.remove();

        if (removedId) {
          for (const node of subtitleHistory.children) {
            if (node.dataset.id === removedId) {
              node.remove();
              break;
            }
          }
        }

        const entry = subtitles.find((item) => item.id === id);
        if (!entry) return;
        const next = createSubtitleLine(entry);
        let existing = null;
        for (const node of subtitleHistory.children) {
          if (node.dataset.id === id) {
            existing = node;
            break;
          }
        }
        if (existing) existing.replaceWith(next);
        else subtitleHistory.appendChild(next);

        if (stickToBottom) subtitleHistory.scrollTop = subtitleHistory.scrollHeight;
      }

      window.electronAPI.subtitle.onTextUpdate((payload) => {
        const item = normalizePayload(payload);
        if (!item) return;

        if (item.action === "upsert") {
          const idx = subtitles.findIndex((s) => s.id === item.id);
          if (idx === -1) {
            // 找不到 id：append 新行，絕不改 last
            subtitles.push({
              id: item.id,
              source: item.source,
              translation: item.translation,
            });
          } else {
            const prev = subtitles[idx];
            const raw = typeof payload === "object" && payload ? payload : {};
            subtitles[idx] = {
              id: item.id,
              source: Object.prototype.hasOwnProperty.call(raw, "source")
                ? String(raw.source || "").trim() || prev.source
                : prev.source,
              translation: Object.prototype.hasOwnProperty.call(raw, "translation")
                ? String(raw.translation || "").trim()
                : prev.translation,
            };
          }
        } else {
          subtitles.push({
            id: item.id,
            source: item.source,
            translation: item.translation,
          });
        }

        let removedId = null;
        while (subtitles.length > MAX_HISTORY) removedId = subtitles.shift().id;
        renderSubtitleUpdate(item.id, removedId);
      });

      /** 複製用純文字（依目前顯示模式） */
      function entryToCopyText(entry) {
        const hasTr = !!entry.translation;
        if (currentMode === "translation") {
          return hasTr ? entry.translation : entry.source;
        }
        if (hasTr && entry.source) return `${entry.source}\n${entry.translation}`;
        return entry.translation || entry.source || "";
      }

      copyBtn.addEventListener("click", async (e) => {
        e.stopPropagation();

        if (subtitles.length === 0) {
          showToast("沒有可複製的內容");
          return;
        }

        const allText = subtitles.map(entryToCopyText).filter(Boolean).join("\n\n");

        try {
          await navigator.clipboard.writeText(allText);
          showToast("已複製到剪貼簿");
          copyBtn.classList.add("copied");
          setTimeout(() => copyBtn.classList.remove("copied"), 1000);
        } catch (err) {
          showToast("複製失敗");
        }
      });

      const closeBtn = document.getElementById("closeBtn");
      closeBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await window.electronAPI.subtitle.close();
      });

      // ===== 顯示模式切換（雙語／僅翻譯，由字幕彈窗擁有）=====
      const displayModeBtn = document.getElementById("displayModeBtn");

      function applyDisplayModeButton() {
        const isTr = currentMode === "translation";
        displayModeBtn.textContent = isTr ? "譯" : "雙";
        displayModeBtn.title = isTr
          ? "僅翻譯（點擊切回雙語字幕）"
          : "雙語字幕（點擊切為僅翻譯）";
      }

      window.electronAPI.store.get("captionDisplayMode", "bilingual").then((v) => {
        currentMode = v === "translation" ? "translation" : "bilingual";
        applyDisplayModeButton();
        renderSubtitles();
      });

      displayModeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        currentMode = currentMode === "translation" ? "bilingual" : "translation";
        window.electronAPI.store.set("captionDisplayMode", currentMode);
        applyDisplayModeButton();
        renderSubtitles();
      });

      let fontScale = 1;
      const FONT_SCALE_MIN = 0.7;
      const FONT_SCALE_MAX = 2.0;

      function applyFontScale() {
        document.documentElement.style.setProperty("--subtitle-scale", fontScale);
      }

      window.electronAPI.store.get("subtitleFontScale", 1).then((v) => {
        const n = Number(v);
        fontScale = Number.isFinite(n)
          ? Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, n))
          : 1;
        applyFontScale();
      });

      function adjustFont(delta) {
        fontScale = Math.min(
          FONT_SCALE_MAX,
          Math.max(FONT_SCALE_MIN, +(fontScale + delta).toFixed(2)),
        );
        applyFontScale();
        window.electronAPI.store.set("subtitleFontScale", fontScale);
      }

      document
        .getElementById("fontDownBtn")
        .addEventListener("click", () => adjustFont(-0.15));
      document
        .getElementById("fontUpBtn")
        .addEventListener("click", () => adjustFont(0.15));

      const OPACITY_STEPS = [1, 0.85, 0.7];
      let opacityIndex = 0;

      window.electronAPI.store.get("subtitleOpacity", 1).then((v) => {
        opacityIndex = Math.max(0, OPACITY_STEPS.indexOf(v));
        window.electronAPI.subtitle.setOpacity(OPACITY_STEPS[opacityIndex]);
      });

      document.getElementById("opacityBtn").addEventListener("click", () => {
        opacityIndex = (opacityIndex + 1) % OPACITY_STEPS.length;
        const value = OPACITY_STEPS[opacityIndex];
        window.electronAPI.subtitle.setOpacity(value);
        window.electronAPI.store.set("subtitleOpacity", value);
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1500);
      }
    </script>
  </body>
</html>
