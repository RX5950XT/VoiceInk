<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceInk 字幕</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
      }

      body {
        font-family:
          "Microsoft JhengHei", "微軟正黑體", "Noto Sans TC", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      .subtitle-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        background-color: #1a1a1a;
      }

      .drag-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background-color: #252525;
        -webkit-app-region: drag;
      }

      .drag-indicator {
        width: 40px;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
      }

      .controls {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }

      .control-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        padding: 0 5px;
        height: 28px;
        border: none;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        opacity: 0.7;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        opacity: 1;
      }

      .control-btn:active {
        transform: scale(0.95);
      }

      .control-btn.copied {
        background: rgba(34, 197, 94, 0.5);
      }

      .control-btn.close-btn:hover {
        background: rgba(239, 68, 68, 0.6);
      }

      .subtitle-history {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
      }

      .subtitle-history::-webkit-scrollbar {
        width: 6px;
      }

      .subtitle-history::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .subtitle-history::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
      }

      .subtitle-history::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      :root {
        --subtitle-scale: 1;
      }

      .subtitle-line {
        color: rgba(255, 255, 255, 0.5);
        font-size: calc(18px * var(--subtitle-scale));
        font-weight: 400;
        line-height: 1.4;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: color 0.3s;
      }

      .subtitle-line:last-child {
        color: #ffffff;
        font-size: calc(22px * var(--subtitle-scale));
        font-weight: 500;
        border-bottom: none;
      }

      .subtitle-line:last-child .subtitle-source {
        color: rgba(255, 255, 255, 0.55);
        font-size: calc(16px * var(--subtitle-scale));
        font-weight: 400;
      }

      .subtitle-line:last-child .subtitle-translation {
        color: #ffffff;
        font-size: calc(22px * var(--subtitle-scale));
        font-weight: 500;
      }

      .subtitle-source {
        display: block;
        color: rgba(255, 255, 255, 0.4);
        font-size: calc(14px * var(--subtitle-scale));
        font-weight: 400;
        line-height: 1.35;
        margin-bottom: 2px;
      }

      .subtitle-translation {
        display: block;
        color: inherit;
        font-size: inherit;
        font-weight: inherit;
        line-height: 1.4;
      }

      .subtitle-line.provisional .subtitle-source {
        font-style: italic;
      }

      .subtitle-empty {
        color: rgba(255, 255, 255, 0.5);
        font-size: calc(18px * var(--subtitle-scale));
        text-align: center;
        font-style: italic;
      }

      .toast {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(34, 197, 94, 0.9);
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="subtitle-container">
      <div class="drag-area">
        <div class="drag-indicator"></div>
        <div class="controls">
          <button id="fontDownBtn" class="control-btn" title="縮小字級">A−</button>
          <button id="fontUpBtn" class="control-btn" title="放大字級">A+</button>
          <button id="opacityBtn" class="control-btn" title="調整視窗透明度">◐</button>
          <button id="displayModeBtn" class="control-btn" title="字幕顯示模式">雙</button>
          <button id="copyBtn" class="control-btn" title="複製全部字幕">
            📋
          </button>
          <button
            id="closeBtn"
            class="control-btn close-btn"
            title="關閉字幕視窗"
          >
            ✕
          </button>
        </div>
      </div>

      <div id="subtitleHistory" class="subtitle-history">
        <p class="subtitle-empty">等待字幕...</p>
      </div>
    </div>

    <div id="toast" class="toast">已複製到剪貼簿</div>

    <script>
      const subtitleHistory = document.getElementById("subtitleHistory");
      const copyBtn = document.getElementById("copyBtn");
      const toast = document.getElementById("toast");

      /** @type {{ id: string, source: string, translation: string }[]} */
      const subtitles = [];
      const MAX_HISTORY = 50;
      let autoId = 0;

      // 字幕彈窗獨佔顯示模式：bilingual 雙語｜translation 僅翻譯（持久化於 store）
      let currentMode = "bilingual";

      /**
       * 正規化 payload：字串 → append 純文字；物件 → upsert/append
       * @param {string | object} payload
       */
      function normalizePayload(payload) {
        if (typeof payload === "string") {
          const text = payload.trim();
          if (!text) return null;
          return {
            id: `s-${++autoId}`,
            source: text,
            translation: "",
            action: "append",
          };
        }
        if (!payload || typeof payload !== "object") return null;

        const source = String(payload.source || payload.text || "").trim();
        const translation = String(payload.translation || "").trim();
        if (!source && !translation) return null;

        return {
          id: payload.id ? String(payload.id) : `s-${++autoId}`,
          source,
          translation,
          action: payload.action === "upsert" ? "upsert" : "append",
        };
      }

      window.electronAPI.subtitle.onTextUpdate((payload) => {
        const item = normalizePayload(payload);
        if (!item) return;

        if (item.action === "upsert") {
          const idx = subtitles.findIndex((s) => s.id === item.id);
          if (idx === -1) {
            // 找不到 id：append 新行，絕不改 last
            subtitles.push({
              id: item.id,
              source: item.source,
              translation: item.translation,
            });
          } else {
            const prev = subtitles[idx];
            const raw = typeof payload === "object" && payload ? payload : {};
            const next = {
              id: item.id,
              source: prev.source,
              translation: prev.translation,
            };
            if (Object.prototype.hasOwnProperty.call(raw, "source")) {
              const s = String(raw.source || "").trim();
              if (s) next.source = s;
            }
            if (Object.prototype.hasOwnProperty.call(raw, "translation")) {
              next.translation = String(raw.translation || "").trim();
            }
            subtitles[idx] = next;
          }
        } else {
          subtitles.push({
            id: item.id,
            source: item.source,
            translation: item.translation,
          });
        }

        while (subtitles.length > MAX_HISTORY) subtitles.shift();
        renderSubtitles();
      });

      function renderLineHtml(entry) {
        const hasTr = !!entry.translation;
        const mode = currentMode;
        const provisional = !hasTr && !!entry.source;

        if (mode === "translation") {
          // 僅翻譯：有譯文只顯示譯文；暫態先顯示原文
          const text = hasTr ? entry.translation : entry.source;
          const cls = provisional ? "subtitle-line provisional" : "subtitle-line";
          return `<div class="${cls}" data-id="${escapeAttr(entry.id)}"><span class="subtitle-translation">${escapeHtml(text)}</span></div>`;
        }

        // 雙語
        if (hasTr) {
          return `<div class="subtitle-line" data-id="${escapeAttr(entry.id)}"><span class="subtitle-source">${escapeHtml(entry.source)}</span><span class="subtitle-translation">${escapeHtml(entry.translation)}</span></div>`;
        }
        return `<div class="subtitle-line provisional" data-id="${escapeAttr(entry.id)}"><span class="subtitle-source">${escapeHtml(entry.source)}</span></div>`;
      }

      function renderSubtitles() {
        if (subtitles.length === 0) {
          subtitleHistory.innerHTML =
            '<p class="subtitle-empty">等待字幕...</p>';
          return;
        }

        subtitleHistory.innerHTML = subtitles.map(renderLineHtml).join("");
        subtitleHistory.scrollTop = subtitleHistory.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text || "";
        return div.innerHTML;
      }

      function escapeAttr(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");
      }

      /** 複製用純文字（依目前顯示模式） */
      function entryToCopyText(entry) {
        const hasTr = !!entry.translation;
        if (currentMode === "translation") {
          return hasTr ? entry.translation : entry.source;
        }
        if (hasTr && entry.source) return `${entry.source}\n${entry.translation}`;
        return entry.translation || entry.source || "";
      }

      copyBtn.addEventListener("click", async (e) => {
        e.stopPropagation();

        if (subtitles.length === 0) {
          showToast("沒有可複製的內容");
          return;
        }

        const allText = subtitles.map(entryToCopyText).filter(Boolean).join("\n\n");

        try {
          await navigator.clipboard.writeText(allText);
          showToast("已複製到剪貼簿");
          copyBtn.classList.add("copied");
          setTimeout(() => copyBtn.classList.remove("copied"), 1000);
        } catch (err) {
          showToast("複製失敗");
        }
      });

      const closeBtn = document.getElementById("closeBtn");
      closeBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await window.electronAPI.subtitle.close();
      });

      // ===== 顯示模式切換（雙語／僅翻譯，由字幕彈窗擁有）=====
      const displayModeBtn = document.getElementById("displayModeBtn");

      function applyDisplayModeButton() {
        const isTr = currentMode === "translation";
        displayModeBtn.textContent = isTr ? "譯" : "雙";
        displayModeBtn.title = isTr
          ? "僅翻譯（點擊切回雙語字幕）"
          : "雙語字幕（點擊切為僅翻譯）";
      }

      window.electronAPI.store.get("captionDisplayMode", "bilingual").then((v) => {
        currentMode = v === "translation" ? "translation" : "bilingual";
        applyDisplayModeButton();
        renderSubtitles();
      });

      displayModeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        currentMode = currentMode === "translation" ? "bilingual" : "translation";
        window.electronAPI.store.set("captionDisplayMode", currentMode);
        applyDisplayModeButton();
        renderSubtitles();
      });

      let fontScale = 1;
      const FONT_SCALE_MIN = 0.7;
      const FONT_SCALE_MAX = 2.0;

      function applyFontScale() {
        document.documentElement.style.setProperty("--subtitle-scale", fontScale);
      }

      window.electronAPI.store.get("subtitleFontScale", 1).then((v) => {
        fontScale = v;
        applyFontScale();
      });

      function adjustFont(delta) {
        fontScale = Math.min(
          FONT_SCALE_MAX,
          Math.max(FONT_SCALE_MIN, +(fontScale + delta).toFixed(2)),
        );
        applyFontScale();
        window.electronAPI.store.set("subtitleFontScale", fontScale);
      }

      document
        .getElementById("fontDownBtn")
        .addEventListener("click", () => adjustFont(-0.15));
      document
        .getElementById("fontUpBtn")
        .addEventListener("click", () => adjustFont(0.15));

      const OPACITY_STEPS = [1, 0.85, 0.7];
      let opacityIndex = 0;

      window.electronAPI.store.get("subtitleOpacity", 1).then((v) => {
        opacityIndex = Math.max(0, OPACITY_STEPS.indexOf(v));
        window.electronAPI.subtitle.setOpacity(OPACITY_STEPS[opacityIndex]);
      });

      document.getElementById("opacityBtn").addEventListener("click", () => {
        opacityIndex = (opacityIndex + 1) % OPACITY_STEPS.length;
        const value = OPACITY_STEPS[opacityIndex];
        window.electronAPI.subtitle.setOpacity(value);
        window.electronAPI.store.set("subtitleOpacity", value);
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1500);
      }
    </script>
  </body>
</html>
