<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <title>VoiceInk 語音輸入</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        /* 藥丸外的區域完全不吃滑鼠：不然這扇看不見的方框會擋住底下的程式 */
        pointer-events: none;
      }

      /* 視窗是固定的大方框，藥丸在裡面置中、寬度由內容撐開。
         方框其餘部分透明且不吃滑鼠，所以做大一點不會擋到底下的程式。 */
      .pill {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        max-width: 100%;
        padding: 6px;
        border-radius: 22px;
        background: rgba(24, 24, 27, 0.94);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
        pointer-events: auto;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 140ms ease, transform 140ms ease;
      }
      .pill.is-shown { opacity: 1; transform: none; }

      .hud-btn {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
        transition: background 120ms ease, transform 120ms ease;
      }
      .hud-btn:hover { background: rgba(255, 255, 255, 0.28); }
      .hud-btn:active { transform: scale(0.92); }
      .hud-btn.is-primary { color: #18181b; background: #fff; }
      .hud-btn.is-primary:hover { background: rgba(255, 255, 255, 0.86); }
      .hud-btn svg { width: 15px; height: 15px; }

      /* 波形：每一格是一根長條，高度跟著音量走。
         用 CSS transition 平滑，不跑 rAF 迴圈——被遮住時 rAF 不觸發。 */
      .wave {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        width: 88px; /* 17 根 × 3px + 16 道 × 2px */
        height: 26px;
      }
      .wave span {
        display: block;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        transition: height 110ms ease-out;
      }

      /* 處理中：沒有音量可畫，改成一道跑馬燈。
         兩顆按鈕一起收掉——這時候已經送出去了，取消與再送出都做不到，
         留著只會讓人按了沒反應；順帶讓「還在講」和「在處理」一眼分得出來。 */
      .pill.is-processing .hud-btn { display: none; }
      .pill.is-processing .wave span { animation: hud-pulse 1.1s ease-in-out infinite; }
      .pill.is-processing .wave span:nth-child(2n) { animation-delay: 0.12s; }
      .pill.is-processing .wave span:nth-child(3n) { animation-delay: 0.24s; }
      @keyframes hud-pulse {
        0%, 100% { height: 4px; opacity: 0.45; }
        50% { height: 18px; opacity: 1; }
      }

      .msg {
        display: none;
        flex: 1 1 auto;
        min-width: 0;
        max-width: 420px;
        padding-right: 6px;
        overflow: hidden;
        color: #fff;
        font-size: 13px;
        line-height: 1.4;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }

      .pill.is-error { background: rgba(74, 22, 26, 0.96); }
      .pill.is-error .wave { display: none; }
      .pill.is-error .hud-btn.is-primary { display: none; }
      /* 三行以內講完；main 那邊已先截到 MAX_ERROR_CHARS */
      .pill.is-error .msg { display: -webkit-box; }

      @media (prefers-reduced-motion: reduce) {
        .pill, .wave span { transition: none; }
        .pill.is-processing .wave span { animation: none; height: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" role="status" aria-live="polite">
      <button type="button" class="hud-btn" id="hudCancel" title="取消（Esc）" aria-label="取消語音輸入">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" />
        </svg>
      </button>
      <div class="wave" id="hudWave" aria-hidden="true"></div>
      <p class="msg" id="hudMsg"></p>
      <button type="button" class="hud-btn is-primary" id="hudStop" title="完成並插入" aria-label="結束並送出">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.5 6.5 12 13 4.5" />
        </svg>
      </button>
    </div>
    <script type="module" src="../scripts/dictation-hud.js"></script>
  </body>
</html>
