[package]
name = "voiceink-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security_Cryptography", "Win32_System_LibraryLoader"] }
wmi = "0.18.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
